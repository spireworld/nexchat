<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexChat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0e14;
            --bg-secondary: #121824;
            --bg-tertiary: #1b2433;
            --accent-blue: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #2a374a;
            --admin-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        /* Авторизація */
        .auth-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(circle at center, #121824 0%, #0b0e14 100%);
        }

        .auth-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .auth-logo h1 {
            font-size: 26px;
            letter-spacing: 1px;
            color: #fff;
        }

        .auth-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .auth-tabs {
            display: flex;
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .auth-tabs button {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }

        .auth-tabs button.active {
            background-color: var(--accent-blue);
            color: white;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent-blue);
        }

        .primary-btn {
            width: 100%;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .primary-btn:hover {
            background-color: var(--accent-hover);
        }

        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }

        /* Основний інтерфейс */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        .sidebar {
            width: 360px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .user-mini-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-placeholder {
            width: 40px;
            height: 40px;
            background-color: var(--accent-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background-color: var(--bg-tertiary);
            color: white;
        }

        .admin-btn {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--admin-color);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .admin-btn:hover {
            background-color: rgba(245, 158, 11, 0.3);
            color: #fbbf24;
        }

        .search-box {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: var(--bg-tertiary);
            margin: 12px 16px;
            border-radius: 8px;
        }

        .search-box input {
            background: none;
            border: none;
            color: white;
            outline: none;
            width: 100%;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .chat-item:hover {
            background-color: var(--bg-tertiary);
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-primary);
        }

        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            gap: 16px;
        }

        .active-chat {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            padding: 16px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-online {
            font-size: 12px;
            color: #22c55e;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 60%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
            color: #fff;
        }

        .message.incoming {
            background-color: var(--bg-secondary);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.outgoing {
            background-color: var(--accent-blue);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message-input-form {
            padding: 16px;
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
        }

        .message-input-form input {
            flex: 1;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        .send-btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Адмін-панель */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .admin-modal {
            background-color: var(--bg-secondary);
            border: 1px solid var(--admin-color);
            border-radius: 16px;
            width: 100%;
            max-width: 550px;
            padding: 24px;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.2);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .admin-header h2 {
            color: var(--admin-color);
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
        }

        .admin-stat-box {
            background-color: var(--bg-primary);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .admin-users-list {
            max-height: 200px;
            overflow-y: auto;
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 10px;
            border: 1px solid var(--border-color);
        }

        .admin-user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        .badge-admin {
            background: var(--admin-color);
            color: #000;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Екран Авторизації / Реєстрації -->
    <div id="auth-screen" class="auth-screen">
        <div class="auth-card">
            <div class="auth-logo">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <h1>NexChat</h1>
            </div>
            <p class="auth-subtitle">Вхід та реєстрація за Нікнеймом</p>
            
            <div class="auth-tabs">
                <button id="tab-signin" class="active" onclick="switchAuthTab('signin')">Вхід</button>
                <button id="tab-signup" onclick="switchAuthTab('signup')">Реєстрація</button>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="input-group">
                    <label>Нікнейм (Username)</label>
                    <input type="text" id="username-input" required placeholder="Введіть ваш нік (напр. Kriexz)">
                </div>
                <div id="signup-fullname-group" class="input-group" style="display: none;">
                    <label>Повне ім'я</label>
                    <input type="text" id="fullname-input" placeholder="Ваше ім'я">
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" id="password-input" required placeholder="••••••••">
                </div>
                <button type="submit" id="auth-btn" class="primary-btn">Увійти</button>
                <p id="auth-error" class="error-msg"></p>
            </form>
        </div>
    </div>

    <!-- Основний месенджер -->
    <div id="app-screen" class="app-container" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-mini-profile">
                    <div id="my-avatar" class="avatar-placeholder">U</div>
                    <div>
                        <span id="my-username" style="font-weight: 600; display: block;">@user</span>
                        <span id="my-badge" style="display: none;" class="badge-admin">ADMIN</span>
                    </div>
                </div>
                <div class="header-actions">
                    <!-- Кнопка адмін панелі (бачить ТІЛЬКИ Kriexz) -->
                    <button id="admin-panel-btn" class="icon-btn admin-btn" onclick="openAdminPanel()" title="Адмін-Панель" style="display: none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
                    </button>
                    <button class="icon-btn" onclick="logoutUser()" title="Вийти">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    </button>
                </div>
            </div>

            <div class="search-box">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-input" placeholder="Пошук користувачів..." oninput="handleSearch(this.value)">
            </div>

            <div class="chat-list" id="chat-list"></div>
        </aside>

        <main class="chat-area">
            <div id="no-chat-selected" class="empty-chat">
                <div style="font-size: 54px;">⚡</div>
                <h2>Вітаємо в NexChat!</h2>
                <p>Виберіть користувача з лівого списку для початку спілкування.</p>
            </div>

            <div id="active-chat-container" class="active-chat" style="display: none;">
                <header class="chat-header">
                    <div class="chat-header-info">
                        <div id="current-chat-avatar" class="avatar-placeholder">#</div>
                        <div>
                            <h3 id="current-chat-title">Чат</h3>
                            <span class="status-online">онлайн</span>
                        </div>
                    </div>
                </header>

                <div class="messages-container" id="messages-container"></div>

                <form class="message-input-form" onsubmit="handleSendMessage(event)">
                    <input type="text" id="message-input" placeholder="Написати повідомлення..." autocomplete="off">
                    <button type="submit" class="send-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Адмін-Панель Модальне Вікно -->
    <div id="admin-modal" class="modal-overlay">
        <div class="admin-modal">
            <div class="admin-header">
                <h2>👑 Панель Адміністратора Kriexz</h2>
                <button class="close-modal" onclick="closeAdminPanel()">×</button>
            </div>
            
            <div class="admin-stat-box">
                <h4 style="color: var(--text-muted); font-size: 13px;">Всього користувачів у системі:</h4>
                <p id="stat-users-count" style="font-size: 28px; font-weight: bold; color: var(--admin-color);">0</p>
            </div>

            <h4 style="margin-bottom: 10px; font-size: 14px; color: var(--text-muted);">Зареєстровані користувачі:</h4>
            <div class="admin-users-list" id="admin-users-list">
                <!-- Список користувачів завантажується динамічно -->
            </div>
        </div>
    </div>

    <!-- Підключення Firebase (Стабільна версія) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, setDoc, doc, getDoc, onSnapshot, addDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Конфігурація Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDR35qbiBixH3y-FuaM5hoYEyLwhLuoA3w",
            authDomain: "nexchat-aabb2.firebaseapp.com",
            projectId: "nexchat-aabb2",
            storageBucket: "nexchat-aabb2.firebasestorage.app",
            messagingSenderId: "160739900339",
            appId: "1:160739900339:web:42775b23e97be5583769c6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentAuthMode = 'signin';
        let currentUser = null;
        let currentUserProfile = null;
        let activeChatId = null;
        let unsubscribeMessages = null;

        // Перемикач режимів авторизації
        window.switchAuthTab = function(mode) {
            currentAuthMode = mode;
            const fullnameGroup = document.getElementById('signup-fullname-group');
            const authBtn = document.getElementById('auth-btn');
            const tabSignin = document.getElementById('tab-signin');
            const tabSignup = document.getElementById('tab-signup');
            document.getElementById('auth-error').innerText = '';

            if (mode === 'signup') {
                fullnameGroup.style.display = 'block';
                authBtn.innerText = 'Зареєструватися';
                tabSignup.classList.add('active');
                tabSignin.classList.remove('active');
            } else {
                fullnameGroup.style.display = 'none';
                authBtn.innerText = 'Увійти';
                tabSignin.classList.add('active');
                tabSignup.classList.remove('active');
            }
        };

        // Вхід / Реєстрація через Нікнейм
        window.handleAuth = async function(event) {
            event.preventDefault();
            const usernameRaw = document.getElementById('username-input').value.trim();
            const usernameLower = usernameRaw.toLowerCase();
            const password = document.getElementById('password-input').value;
            const errorEl = document.getElementById('auth-error');
            errorEl.innerText = '';

            if (!usernameRaw) {
                errorEl.innerText = 'Введіть ваш нікнейм';
                return;
            }

            // Формуємо службовий email для Firebase Auth
            const syntheticEmail = `${usernameLower}@nexchat.app`;

            try {
                if (currentAuthMode === 'signup') {
                    const fullname = document.getElementById('fullname-input').value.trim();
                    
                    // Створення акаунта у Firebase Auth
                    const res = await createUserWithEmailAndPassword(auth, syntheticEmail, password);
                    
                    // Збереження даних профілю у Firestore
                    await setDoc(doc(db, 'profiles', res.user.uid), {
                        uid: res.user.uid,
                        username: usernameRaw,
                        usernameLower: usernameLower,
                        fullname: fullname || usernameRaw,
                        isAdmin: (usernameLower === 'kriexz'),
                        createdAt: serverTimestamp()
                    });
                } else {
                    await signInWithEmailAndPassword(auth, syntheticEmail, password);
                }
            } catch (err) {
                console.error(err);
                if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
                    errorEl.innerText = 'Невірний нікнейм або пароль';
                } else if (err.code === 'auth/email-already-in-use') {
                    errorEl.innerText = 'Цей нікнейм вже зайнятий! Оберіть інший або увійдіть.';
                } else if (err.code === 'auth/weak-password') {
                    errorEl.innerText = 'Пароль має бути не менше 6 символів.';
                } else {
                    errorEl.innerText = err.message;
                }
            }
        };

        window.logoutUser = function() {
            signOut(auth);
        };

        // Спостерігач стану авторизації
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                
                try {
                    const profileDoc = await getDoc(doc(db, 'profiles', user.uid));
                    if (profileDoc.exists()) {
                        currentUserProfile = profileDoc.data();
                        
                        document.getElementById('my-username').innerText = `@${currentUserProfile.username}`;
                        document.getElementById('my-avatar').innerText = currentUserProfile.username[0].toUpperCase();

                        // Перевірка чи це адміністратор Kriexz
                        if (currentUserProfile.usernameLower === 'kriexz' || currentUserProfile.isAdmin) {
                            document.getElementById('admin-panel-btn').style.display = 'flex';
                            document.getElementById('my-badge').style.display = 'inline-block';
                        } else {
                            document.getElementById('admin-panel-btn').style.display = 'none';
                            document.getElementById('my-badge').style.display = 'none';
                        }
                    }
                } catch (e) {
                    console.error("Помилка завантаження профілю:", e);
                }

                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                loadChats();
            } else {
                currentUser = null;
                currentUserProfile = null;
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('app-screen').style.display = 'none';
            }
        });

        // Завантаження списку користувачів
        async function loadChats() {
            const chatListEl = document.getElementById('chat-list');
            chatListEl.innerHTML = '';

            try {
                const querySnapshot = await getDocs(collection(db, 'profiles'));
                querySnapshot.forEach((docSnap) => {
                    const profile = docSnap.data();
                    if (!profile.uid || profile.uid === currentUser.uid) return;

                    const div = document.createElement('div');
                    div.className = 'chat-item';
                    div.innerHTML = `
                        <div class="avatar-placeholder">${profile.username[0].toUpperCase()}</div>
                        <div>
                            <h4 style="font-size: 15px;">${profile.fullname || profile.username}</h4>
                            <span style="font-size: 12px; color: var(--text-muted);">@${profile.username}</span>
                        </div>
                    `;
                    div.onclick = () => openChat(profile.uid, profile.username);
                    chatListEl.appendChild(div);
                });
            } catch (e) {
                console.error("Помилка завантаження чатів:", e);
            }
        }

        // Відкриття чату
        async function openChat(recipientId, recipientName) {
            activeChatId = [currentUser.uid, recipientId].sort().join('_');
            
            document.getElementById('no-chat-selected').style.display = 'none';
            document.getElementById('active-chat-container').style.display = 'flex';
            document.getElementById('current-chat-title').innerText = `@${recipientName}`;
            document.getElementById('current-chat-avatar').innerText = recipientName[0].toUpperCase();

            const messagesContainer = document.getElementById('messages-container');
            messagesContainer.innerHTML = '';

            if (unsubscribeMessages) unsubscribeMessages();

            const q = query(collection(db, `chats/${activeChatId}/messages`), orderBy('createdAt', 'asc'));
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                messagesContainer.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${msg.senderId === currentUser.uid ? 'outgoing' : 'incoming'}`;
                    msgDiv.innerText = msg.text;
                    messagesContainer.appendChild(msgDiv);
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        // Надсилання повідомлення
        window.handleSendMessage = async function(event) {
            event.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !activeChatId) return;

            try {
                await addDoc(collection(db, `chats/${activeChatId}/messages`), {
                    text,
                    senderId: currentUser.uid,
                    createdAt: serverTimestamp()
                });
                input.value = '';
            } catch (e) {
                console.error("Помилка надсилання:", e);
            }
        };

        // Пошук
        window.handleSearch = function(queryText) {
            const items = document.querySelectorAll('.chat-item');
            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                item.style.display = text.includes(queryText.toLowerCase()) ? 'flex' : 'none';
            });
        };

        // Адмін-Панель (Тільки для Kriexz)
        window.openAdminPanel = async function() {
            document.getElementById('admin-modal').style.display = 'flex';
            const usersListEl = document.getElementById('admin-users-list');
            usersListEl.innerHTML = '';

            try {
                const querySnapshot = await getDocs(collection(db, 'profiles'));
                document.getElementById('stat-users-count').innerText = querySnapshot.size;

                querySnapshot.forEach((docSnap) => {
                    const u = docSnap.data();
                    const row = document.createElement('div');
                    row.className = 'admin-user-row';
                    row.innerHTML = `
                        <div>
                            <strong>@${u.username}</strong> (${u.fullname || 'Без імені'})
                        </div>
                        <div>
                            ${u.usernameLower === 'kriexz' ? '<span class="badge-admin">OWNER</span>' : '<span style="color:var(--text-muted); font-size:12px;">Користувач</span>'}
                        </div>
                    `;
                    usersListEl.appendChild(row);
                });
            } catch (e) {
                console.error(e);
            }
        };

        window.closeAdminPanel = function() {
            document.getElementById('admin-modal').style.display = 'none';
        };
    </script>
</body>
</html>
