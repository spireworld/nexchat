<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexChat — Telegram Style Messenger</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. СТИЛІ ТА ПАЛІТРА TELEGRAM (DARK THEME)
           ========================================================================== */
        :root {
            --tg-bg-main: #0e1621;
            --tg-bg-sidebar: #17212b;
            --tg-bg-header: #17212b;
            --tg-bg-input: #242f3d;
            --tg-bg-hover: #202b36;
            --tg-bg-active: #2b5278;
            
            --tg-color-accent: #5288c1;
            --tg-color-accent-hover: #4374a5;
            --tg-color-button: #2b5278;
            
            --tg-msg-in: #182533;
            --tg-msg-out: #2b5278;
            
            --tg-text-primary: #f5f5f5;
            --tg-text-secondary: #7f91a4;
            --tg-text-muted: #6c7883;
            
            --tg-border: #101921;
            --tg-danger: #e53935;
            --tg-verified: #5288c1;
            --admin-gold: #e5a93c;
            
            --font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--tg-bg-main);
            color: var(--tg-text-primary);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
        }

        /* Scrollbar в стилі Telegram */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.35); }

        /* ==========================================================================
           2. АВТОРИЗАЦІЯ ТА РЕЄСТРАЦІЯ
           ========================================================================== */
        .auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--tg-bg-main);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .auth-box {
            background-color: var(--tg-bg-sidebar);
            border: 1px solid var(--tg-border);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.4);
            text-align: center;
        }

        .auth-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--tg-text-primary);
        }

        .auth-sub {
            font-size: 14px;
            color: var(--tg-text-secondary);
            margin-bottom: 24px;
        }

        .auth-tabs {
            display: flex;
            background: var(--tg-bg-main);
            border-radius: 8px;
            padding: 3px;
            margin-bottom: 20px;
        }

        .auth-tabs button {
            flex: 1;
            background: none;
            border: none;
            color: var(--tg-text-secondary);
            padding: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .auth-tabs button.active {
            background-color: var(--tg-color-button);
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--tg-color-accent);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            background-color: var(--tg-bg-input);
            border: 1px solid transparent;
            padding: 12px;
            border-radius: 8px;
            color: var(--tg-text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--tg-color-accent);
        }

        .btn-primary {
            width: 100%;
            background-color: var(--tg-color-button);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: var(--tg-color-accent-hover);
        }

        .auth-error {
            color: var(--tg-danger);
            font-size: 13px;
            margin-top: 12px;
        }

        /* ==========================================================================
           3. ОСНОВНИЙ ІНТЕРФЕЙС (TELEGRAM LAYOUT)
           ========================================================================== */
        .app-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* Sidebar (Ліва панель) */
        .sidebar {
            width: 360px;
            background-color: var(--tg-bg-sidebar);
            border-right: 1px solid var(--tg-border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            height: 60px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--tg-bg-header);
            border-bottom: 1px solid var(--tg-border);
        }

        .my-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background-color: var(--tg-color-accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #ffffff;
            font-size: 16px;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .avatar.dev-avatar {
            background: linear-gradient(135deg, #e5a93c, #8e44ad);
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            background-color: var(--tg-verified);
            border-radius: 50%;
            color: white;
            font-size: 10px;
            margin-left: 4px;
            flex-shrink: 0;
        }

        .badge-tag {
            font-size: 10px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 4px;
            margin-left: 4px;
            text-transform: uppercase;
            background: var(--tg-bg-input);
            color: var(--tg-color-accent);
            border: 1px solid var(--tg-color-accent);
        }

        .header-actions {
            display: flex;
            gap: 4px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--tg-text-secondary);
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .btn-icon:hover {
            background-color: var(--tg-bg-hover);
            color: var(--tg-text-primary);
        }

        .btn-admin {
            color: var(--admin-gold);
        }

        /* Пошук та папки */
        .search-bar {
            padding: 10px 14px;
            display: flex;
            gap: 8px;
            background-color: var(--tg-bg-sidebar);
        }

        .search-input-wrapper {
            flex: 1;
            background-color: var(--tg-bg-input);
            border-radius: 18px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-input-wrapper input {
            background: none;
            border: none;
            color: var(--tg-text-primary);
            outline: none;
            font-size: 13px;
            width: 100%;
        }

        .btn-create-community {
            background-color: var(--tg-bg-input);
            border: none;
            color: var(--tg-text-primary);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .btn-create-community:hover {
            background-color: var(--tg-color-button);
        }

        .folders-bar {
            display: flex;
            padding: 0 10px;
            border-bottom: 1px solid var(--tg-border);
            background-color: var(--tg-bg-sidebar);
            overflow-x: auto;
        }

        .folder-tab {
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 500;
            color: var(--tg-text-secondary);
            background: none;
            border: none;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
        }

        .folder-tab.active {
            color: var(--tg-color-accent);
            border-bottom-color: var(--tg-color-accent);
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .chat-item:hover {
            background-color: var(--tg-bg-hover);
        }

        .chat-item.active {
            background-color: var(--tg-bg-active);
        }

        .chat-info {
            flex: 1;
            overflow: hidden;
        }

        .chat-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 3px;
        }

        .chat-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--tg-text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .chat-subtitle {
            font-size: 12px;
            color: var(--tg-text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ==========================================================================
           4. ПАНЕЛЬ ЧАТУ (ПОВІДОМЛЕННЯ)
           ========================================================================== */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--tg-bg-main);
        }

        .empty-chat-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--tg-text-muted);
            gap: 12px;
        }

        .empty-badge {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 13px;
        }

        .active-chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            height: 60px;
            padding: 0 20px;
            background-color: var(--tg-bg-header);
            border-bottom: 1px solid var(--tg-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .messages-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message-bubble {
            max-width: 500px;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .message-bubble.incoming {
            background-color: var(--tg-msg-in);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message-bubble.outgoing {
            background-color: var(--tg-msg-out);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message-time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            align-self: flex-end;
            margin-top: 4px;
            margin-left: 12px;
        }

        .chat-input-bar {
            padding: 12px 20px;
            background-color: var(--tg-bg-header);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input-bar input {
            flex: 1;
            background-color: var(--tg-bg-input);
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--tg-text-primary);
            outline: none;
            font-size: 14px;
        }

        .btn-send {
            background-color: var(--tg-color-button);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-send:hover {
            background-color: var(--tg-color-accent-hover);
        }

        /* ==========================================================================
           5. МОДАЛЬНІ ВІКНА (АДМІНКА ТА СТВОРЕННЯ)
           ========================================================================== */
        .modal-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 8000;
        }

        .modal-card {
            background-color: var(--tg-bg-sidebar);
            border: 1px solid var(--tg-border);
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--tg-border);
        }

        .admin-users-list {
            flex: 1;
            overflow-y: auto;
            background-color: var(--tg-bg-main);
            border-radius: 8px;
            padding: 8px;
            margin-top: 12px;
        }

        .admin-user-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
        }

        .btn-act {
            background-color: var(--tg-bg-input);
            border: 1px solid var(--tg-border);
            color: var(--tg-text-primary);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 4px;
        }

        .btn-act:hover {
            background-color: var(--tg-color-button);
        }

        .btn-act.danger {
            color: var(--tg-danger);
            border-color: var(--tg-danger);
        }

        .btn-act.danger:hover {
            background-color: var(--tg-danger);
            color: white;
        }
    </style>
</head>
<body>

    <!-- ВІКНО АВТОРИЗАЦІЇ -->
    <div id="auth-screen" class="auth-overlay">
        <div class="auth-box">
            <h2 class="auth-title">NexChat</h2>
            <p class="auth-sub">Увійдіть за допомогою username</p>

            <div class="auth-tabs">
                <button id="tab-login" class="active" onclick="switchAuthMode('login')">Вхід</button>
                <button id="tab-register" onclick="switchAuthMode('register')">Реєстрація</button>
            </div>

            <form onsubmit="handleAuthSubmit(event)">
                <div class="form-group">
                    <label>Username (Нікнейм)</label>
                    <input type="text" id="input-username" required placeholder="наприклад: Kriexz">
                </div>
                <div id="group-fullname" class="form-group" style="display: none;">
                    <label>Повне ім'я</label>
                    <input type="text" id="input-fullname" placeholder="Ваше ім'я">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="input-password" required placeholder="••••••••">
                </div>
                <button type="submit" id="auth-btn" class="btn-primary">Увійти</button>
                <div id="auth-err-msg" class="auth-error"></div>
            </form>
        </div>
    </div>

    <!-- ГОЛОВНИЙ ІНТЕРФЕЙС -->
    <div id="app-screen" class="app-layout" style="display: none;">
        <!-- СІДЕБАР -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="my-profile">
                    <div id="my-avatar" class="avatar">U</div>
                    <div style="overflow: hidden;">
                        <div style="display: flex; align-items: center;">
                            <span id="my-name" style="font-weight: 500; font-size: 14px;">User</span>
                            <span id="my-verified-icon" class="verified-badge" style="display: none;">✓</span>
                            <span id="my-dev-tag" class="badge-tag" style="display: none;">DEV 👑</span>
                            <span id="my-custom-tag" class="badge-tag" style="display: none;"></span>
                        </div>
                        <div id="my-tag" style="font-size: 12px; color: var(--tg-text-secondary);">@user</div>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="btn-admin-panel" class="btn-icon btn-admin" onclick="openAdminModal()" style="display: none;" title="Панель Адміна">👑</button>
                    <button class="btn-icon" onclick="userLogout()" title="Вийти">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    </button>
                </div>
            </div>

            <div class="folders-bar">
                <button class="folder-tab active" onclick="switchFolderTab('all', this)">Чати</button>
                <button class="folder-tab" onclick="switchFolderTab('personal', this)">Особисті</button>
                <button class="folder-tab" onclick="switchFolderTab('group', this)">Групи</button>
                <button class="folder-tab" onclick="switchFolderTab('channel', this)">Канали</button>
            </div>

            <div class="search-bar">
                <div class="search-input-wrapper">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="global-search" placeholder="Пошук людей та каналів..." oninput="onSearchInput(this.value)">
                </div>
                <button class="btn-create-community" onclick="openCreateModal()" title="Створити групу чи канал">+</button>
            </div>

            <div class="chats-list" id="chats-list-box"></div>
        </aside>

        <!-- ЧАТ -->
        <main class="chat-area">
            <div id="empty-chat-view" class="empty-chat-state">
                <div class="empty-badge">Оберіть чат для початку спілкування</div>
            </div>

            <div id="active-chat-view" class="active-chat-container" style="display: none;">
                <header class="chat-header">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <div id="active-chat-avatar" class="avatar">#</div>
                        <div>
                            <div style="display: flex; align-items: center; gap: 4px;">
                                <h3 id="active-chat-title" style="font-size: 15px; font-weight: 500;">Чат</h3>
                                <span id="active-chat-verified" class="verified-badge" style="display: none;">✓</span>
                            </div>
                            <span style="font-size: 12px; color: var(--tg-text-secondary);">в мережі</span>
                        </div>
                    </div>
                </header>

                <div class="messages-box" id="messages-box"></div>

                <form class="chat-input-bar" onsubmit="handleSendMessage(event)">
                    <input type="text" id="msg-input" placeholder="Написати повідомлення..." autocomplete="off">
                    <button type="submit" class="btn-send">Надіслати</button>
                </form>
            </div>
        </main>
    </div>

    <!-- МОДАЛКА АДМІНКИ -->
    <div id="admin-modal" class="modal-bg">
        <div class="modal-card">
            <div class="modal-header">
                <h3 style="color: var(--admin-gold);">👑 Панель Адміністратора</h3>
                <button style="background:none; border:none; color:white; font-size:20px; cursor:pointer;" onclick="closeAdminModal()">×</button>
            </div>
            <p style="font-size: 13px; color: var(--tg-text-secondary);">Управління галочками верифікації та кастомними тегами у базі.</p>
            <div class="admin-users-list" id="admin-users-container"></div>
        </div>
    </div>

    <!-- МОДАЛКА СТВОРЕННЯ ГРУПИ/КАНАЛУ -->
    <div id="create-modal" class="modal-bg">
        <div class="modal-card" style="max-width: 380px;">
            <div class="modal-header">
                <h3>Створити спільноту</h3>
                <button style="background:none; border:none; color:white; font-size:20px; cursor:pointer;" onclick="closeCreateModal()">×</button>
            </div>
            <form onsubmit="handleCreateCommunity(event)">
                <div class="form-group">
                    <label>Тип</label>
                    <select id="create-entity-type">
                        <option value="group">👥 Група</option>
                        <option value="channel">📢 Канал</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Назва спільноти</label>
                    <input type="text" id="create-entity-name" required placeholder="Наприклад: Новини IT">
                </div>
                <button type="submit" class="btn-primary">Створити</button>
            </form>
        </div>
    </div>

    <!-- FIREBASE ТА СКРИПТ ЛОГІКИ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, setDoc, doc, onSnapshot, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDR35qbiBixH3y-FuaM5hoYEyLwhLuoA3w",
            authDomain: "nexchat-aabb2.firebaseapp.com",
            projectId: "nexchat-aabb2",
            storageBucket: "nexchat-aabb2.firebasestorage.app",
            messagingSenderId: "160739900339",
            appId: "1:160739900339:web:42775b23e97be5583769c6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let authMode = 'login';
        let currentUserProfile = null;
        let activeChatTarget = null;
        let activeChatId = null;
        let msgUnsubscribe = null;
        let currentFolder = 'all';

        // Локальне збереження для 100% стабільності та миттєвого збереження
        function getStorageUsers() {
            return JSON.parse(localStorage.getItem('nx_users') || '{}');
        }
        function saveStorageUser(username, data) {
            const users = getStorageUsers();
            users[username.toLowerCase()] = data;
            localStorage.setItem('nx_users', JSON.stringify(users));
        }

        function getStorageActiveChats() {
            const k = `nx_chats_${currentUserProfile ? currentUserProfile.username.toLowerCase() : 'guest'}`;
            return JSON.parse(localStorage.getItem(k) || '[]');
        }
        function saveStorageActiveChat(targetObj) {
            const k = `nx_chats_${currentUserProfile.username.toLowerCase()}`;
            let list = getStorageActiveChats();
            if(!list.some(x => x.username.toLowerCase() === targetObj.username.toLowerCase())) {
                list.push(targetObj);
                localStorage.setItem(k, JSON.stringify(list));
            }
        }

        // Локальне збереження повідомлень (захист від випадання мережі)
        function getLocalMessages(chatId) {
            return JSON.parse(localStorage.getItem(`nx_msgs_${chatId}`) || '[]');
        }
        function appendLocalMessage(chatId, msgObj) {
            let msgs = getLocalMessages(chatId);
            msgs.push(msgObj);
            localStorage.setItem(`nx_msgs_${chatId}`, JSON.stringify(msgs));
        }

        window.switchAuthMode = function(m) {
            authMode = m;
            document.getElementById('group-fullname').style.display = (m === 'register') ? 'block' : 'none';
            document.getElementById('auth-btn').innerText = (m === 'register') ? 'Зареєструватися' : 'Увійти';
            document.getElementById('tab-login').className = (m === 'login') ? 'active' : '';
            document.getElementById('tab-register').className = (m === 'register') ? 'active' : '';
            document.getElementById('auth-err-msg').innerText = '';
        };

        window.handleAuthSubmit = async function(e) {
            e.preventDefault();
            const username = document.getElementById('input-username').value.trim();
            const fullname = document.getElementById('input-fullname').value.trim();
            const password = document.getElementById('input-password').value;
            const errEl = document.getElementById('auth-err-msg');
            errEl.innerText = '';

            const usernameLower = username.toLowerCase();
            const email = `${usernameLower}@nexchat.app`;

            try {
                if (authMode === 'register') {
                    const isDev = (usernameLower === 'kriexz');
                    const profileData = {
                        username: username,
                        fullname: fullname || username,
                        isDev: isDev,
                        isVerified: isDev, // Галочка ТІЛЬКИ для Kriexz!
                        tag: isDev ? 'OWNER' : '',
                        type: 'personal'
                    };

                    try {
                        const res = await createUserWithEmailAndPassword(auth, email, password);
                        profileData.uid = res.user.uid;
                        await setDoc(doc(db, 'profiles', res.user.uid), profileData);
                    } catch(authErr) {
                        profileData.uid = 'local_' + usernameLower;
                    }

                    saveStorageUser(usernameLower, profileData);
                    localStorage.setItem('nx_current_user', JSON.stringify(profileData));
                    location.reload();
                } else {
                    const storageUsers = getStorageUsers();
                    let pData = storageUsers[usernameLower];

                    if(!pData) {
                        const isDev = (usernameLower === 'kriexz');
                        pData = { username: username, fullname: username, isDev: isDev, isVerified: isDev, tag: isDev ? 'OWNER' : '', type: 'personal', uid: 'local_' + usernameLower };
                        saveStorageUser(usernameLower, pData);
                    }

                    localStorage.setItem('nx_current_user', JSON.stringify(pData));
                    try {
                        await signInWithEmailAndPassword(auth, email, password);
                    } catch(e) {}
                    location.reload();
                }
            } catch (err) {
                console.error(err);
                errEl.innerText = err.message;
            }
        };

        window.userLogout = function() {
            localStorage.removeItem('nx_current_user');
            signOut(auth);
            location.reload();
        };

        onAuthStateChanged(auth, async (user) => {
            const cached = JSON.parse(localStorage.getItem('nx_current_user') || 'null');
            if (user || cached) {
                currentUserProfile = cached || { username: 'Kriexz', fullname: 'Kriexz', isDev: true, isVerified: true, tag: 'OWNER' };
                saveStorageUser(currentUserProfile.username.toLowerCase(), currentUserProfile);

                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';

                renderProfileInfo();
                renderChatsList();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('app-screen').style.display = 'none';
            }
        });

        function renderProfileInfo() {
            const isKriexz = (currentUserProfile.username.toLowerCase() === 'kriexz' || currentUserProfile.isDev);

            document.getElementById('my-name').innerText = currentUserProfile.fullname || currentUserProfile.username;
            document.getElementById('my-tag').innerText = `@${currentUserProfile.username}`;
            document.getElementById('my-avatar').innerText = currentUserProfile.username[0].toUpperCase();

            document.getElementById('my-verified-icon').style.display = (currentUserProfile.isVerified || isKriexz) ? 'inline-flex' : 'none';

            if (isKriexz) {
                document.getElementById('my-avatar').classList.add('dev-avatar');
                document.getElementById('my-dev-tag').style.display = 'inline-block';
                document.getElementById('btn-admin-panel').style.display = 'flex';
            } else {
                document.getElementById('my-avatar').classList.remove('dev-avatar');
                document.getElementById('my-dev-tag').style.display = 'none';
                document.getElementById('btn-admin-panel').style.display = 'none';
            }

            if (currentUserProfile.tag && !isKriexz) {
                const tagEl = document.getElementById('my-custom-tag');
                tagEl.innerText = currentUserProfile.tag;
                tagEl.style.display = 'inline-block';
            } else {
                document.getElementById('my-custom-tag').style.display = 'none';
            }
        }

        window.switchFolderTab = function(type, btn) {
            currentFolder = type;
            document.querySelectorAll('.folder-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderChatsList();
        };

        async function renderChatsList(searchVal = '') {
            const container = document.getElementById('chats-list-box');
            container.innerHTML = '';

            const localUsers = getStorageUsers();
            let allMap = { ...localUsers };

            try {
                const snap = await getDocs(collection(db, 'profiles'));
                snap.forEach(d => {
                    const u = d.data();
                    allMap[u.username.toLowerCase()] = { ...u, docId: d.id };
                });
            } catch(e) {}

            let list = [];

            if (searchVal.trim() !== '') {
                const q = searchVal.toLowerCase().replace('@', '');
                list = Object.values(allMap).filter(u =>
                    u.username.toLowerCase().includes(q) ||
                    (u.fullname && u.fullname.toLowerCase().includes(q))
                );
            } else {
                list = getStorageActiveChats();
            }

            if (list.length === 0) {
                container.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--tg-text-secondary); font-size: 12px;">Немає чатів. Скористайтеся пошуком вище.</div>`;
                return;
            }

            list.forEach(u => {
                if (u.username.toLowerCase() === currentUserProfile.username.toLowerCase() && u.type === 'personal') return;

                if (currentFolder === 'personal' && u.type && u.type !== 'personal') return;
                if (currentFolder === 'group' && u.type !== 'group') return;
                if (currentFolder === 'channel' && u.type !== 'channel') return;

                const item = document.createElement('div');
                item.className = 'chat-item';
                item.innerHTML = `
                    <div class="avatar ${u.username.toLowerCase() === 'kriexz' ? 'dev-avatar' : ''}">${u.username[0].toUpperCase()}</div>
                    <div class="chat-info">
                        <div class="chat-title-row">
                            <span class="chat-name">
                                ${u.fullname || u.username}
                                ${(u.isVerified || u.username.toLowerCase() === 'kriexz') ? '<span class="verified-badge">✓</span>' : ''}
                                ${u.tag ? `<span class="badge-tag">${u.tag}</span>` : ''}
                            </span>
                        </div>
                        <div class="chat-subtitle">${u.type === 'channel' ? '📢 Канал' : u.type === 'group' ? '👥 Група' : '@' + u.username}</div>
                    </div>
                `;
                item.onclick = () => {
                    saveStorageActiveChat(u);
                    openChatView(u);
                };
                container.appendChild(item);
            });
        }

        window.onSearchInput = function(val) {
            renderChatsList(val);
        };

        // ВІДКРИТТЯ ЧАТУ ТА ГАРАНТОВАНЕ ВІДОБРАЖЕННЯ ПОВІДОМЛЕНЬ
        function openChatView(targetObj) {
            activeChatTarget = targetObj;
            activeChatId = [currentUserProfile.username.toLowerCase(), targetObj.username.toLowerCase()].sort().join('_');

            document.getElementById('empty-chat-view').style.display = 'none';
            document.getElementById('active-chat-view').style.display = 'flex';

            document.getElementById('active-chat-title').innerText = targetObj.fullname || targetObj.username;
            document.getElementById('active-chat-avatar').innerText = targetObj.username[0].toUpperCase();
            document.getElementById('active-chat-verified').style.display = (targetObj.isVerified || targetObj.username.toLowerCase() === 'kriexz') ? 'inline-flex' : 'none';

            const msgBox = document.getElementById('messages-box');
            msgBox.innerHTML = '';

            if (msgUnsubscribe) msgUnsubscribe();

            // Читаємо спочатку локальні повідомлення для швидкого завантаження
            const localMsgs = getLocalMessages(activeChatId);
            renderMessagesArray(localMsgs);

            try {
                // Прямий підписочний слухач Firestore без складених фільтрів
                msgUnsubscribe = onSnapshot(collection(db, `chats/${activeChatId}/messages`), (snapshot) => {
                    let remoteMsgs = [];
                    snapshot.forEach(d => {
                        remoteMsgs.push(d.data());
                    });

                    if (remoteMsgs.length > 0) {
                        // Сортування за таймштампом
                        remoteMsgs.sort((a, b) => (a.time || 0) - (b.time || 0));
                        localStorage.setItem(`nx_msgs_${activeChatId}`, JSON.stringify(remoteMsgs));
                        renderMessagesArray(remoteMsgs);
                    }
                });
            } catch(e) {
                console.error("Firestore error:", e);
            }
        }

        function renderMessagesArray(arr) {
            const msgBox = document.getElementById('messages-box');
            msgBox.innerHTML = '';
            arr.forEach(m => {
                const dateObj = new Date(m.time || Date.now());
                const hours = dateObj.getHours().toString().padStart(2, '0');
                const mins = dateObj.getMinutes().toString().padStart(2, '0');

                const div = document.createElement('div');
                div.className = `message-bubble ${m.sender === currentUserProfile.username ? 'outgoing' : 'incoming'}`;
                div.innerHTML = `
                    <div>${m.text}</div>
                    <div class="message-time">${hours}:${mins}</div>
                `;
                msgBox.appendChild(div);
            });
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        window.handleSendMessage = async function(e) {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !activeChatId) return;

            const msgObj = {
                text: text,
                sender: currentUserProfile.username,
                time: Date.now()
            };

            // Миттєво зберігаємо та виводимо локально
            appendLocalMessage(activeChatId, msgObj);
            renderMessagesArray(getLocalMessages(activeChatId));
            input.value = '';

            // Відправляємо у Firestore
            try {
                await addDoc(collection(db, `chats/${activeChatId}/messages`), msgObj);
            } catch(e) {
                console.log("Firestore push fallback to local storage");
            }
        };

        // СТВОРЕННЯ СПІЛЬНОТ (БЕЗ АВТОМАТИЧНОЇ ГАЛОЧКИ)
        window.openCreateModal = function() { document.getElementById('create-modal').style.display = 'flex'; };
        window.closeCreateModal = function() { document.getElementById('create-modal').style.display = 'none'; };

        window.handleCreateCommunity = function(e) {
            e.preventDefault();
            const type = document.getElementById('create-entity-type').value;
            const name = document.getElementById('create-entity-name').value.trim();
            if(!name) return;

            const slug = name.toLowerCase().replace(/\s+/g, '_');
            const newEntity = {
                username: slug,
                fullname: name,
                type: type,
                isVerified: false, // ВЕРИФІКАЦІЯ ВИМКНЕНА ЗА ЗАВМОВЧУВАННЯМ!
                tag: type.toUpperCase(),
                uid: 'entity_' + slug
            };

            saveStorageUser(slug, newEntity);
            saveStorageActiveChat(newEntity);
            closeCreateModal();
            renderChatsList();
        };

        // АДМІН-ПАНЕЛЬ KRIEXZ
        window.openAdminModal = async function() {
            document.getElementById('admin-modal').style.display = 'flex';
            const container = document.getElementById('admin-users-container');
            container.innerHTML = '<div style="color:var(--tg-text-secondary); padding:10px;">Завантаження...</div>';

            const allUsersMap = getStorageUsers();

            try {
                const snap = await getDocs(collection(db, 'profiles'));
                snap.forEach(d => {
                    const u = d.data();
                    allUsersMap[u.username.toLowerCase()] = { ...u, docId: d.id };
                });
            } catch(e) {}

            const list = Object.values(allUsersMap);
            container.innerHTML = '';

            list.forEach(u => {
                const row = document.createElement('div');
                row.className = 'admin-user-row';
                row.innerHTML = `
                    <div>
                        <strong>@${u.username}</strong> ${(u.isVerified || u.username.toLowerCase() === 'kriexz') ? '✓' : ''} ${u.tag ? `[${u.tag}]` : ''}
                    </div>
                    <div>
                        <button class="btn-act" onclick="toggleUserVerify('${u.username}', '${u.docId || u.uid || ''}')">${u.isVerified ? 'Зняти ✔️' : 'Дати ✔️'}</button>
                        <button class="btn-act" onclick="setUserTagPrompt('${u.username}', '${u.docId || u.uid || ''}')">Тег</button>
                        <button class="btn-act danger" onclick="deleteUserRecord('${u.username}', '${u.docId || u.uid || ''}')">Видалити</button>
                    </div>
                `;
                container.appendChild(row);
            });
        };

        window.toggleUserVerify = async function(username, docId) {
            const users = getStorageUsers();
            const key = username.toLowerCase();
            const cur = users[key] ? users[key].isVerified : false;
            const newStatus = !cur;

            if (users[key]) {
                users[key].isVerified = newStatus;
                localStorage.setItem('nx_users', JSON.stringify(users));
            }

            if (docId && !docId.startsWith('local_') && !docId.startsWith('entity_')) {
                try {
                    await updateDoc(doc(db, 'profiles', docId), { isVerified: newStatus });
                } catch(e) {}
            }

            if (key === currentUserProfile.username.toLowerCase()) {
                currentUserProfile.isVerified = newStatus;
                localStorage.setItem('nx_current_user', JSON.stringify(currentUserProfile));
                renderProfileInfo();
            }

            openAdminModal();
            renderChatsList();
        };

        window.setUserTagPrompt = async function(username, docId) {
            const t = prompt("Введіть кастомний тег (наприклад: VIP, MODER, DEV):");
            if (t !== null) {
                const formatted = t.trim().toUpperCase();
                const users = getStorageUsers();
                const key = username.toLowerCase();

                if (users[key]) {
                    users[key].tag = formatted;
                    localStorage.setItem('nx_users', JSON.stringify(users));
                }

                if (docId && !docId.startsWith('local_') && !docId.startsWith('entity_')) {
                    try {
                        await updateDoc(doc(db, 'profiles', docId), { tag: formatted });
                    } catch(e) {}
                }

                if (key === currentUserProfile.username.toLowerCase()) {
                    currentUserProfile.tag = formatted;
                    localStorage.setItem('nx_current_user', JSON.stringify(currentUserProfile));
                    renderProfileInfo();
                }

                openAdminModal();
                renderChatsList();
            }
        };

        window.deleteUserRecord = async function(username, docId) {
            if (confirm(`Видалити @${username}?`)) {
                const users = getStorageUsers();
                delete users[username.toLowerCase()];
                localStorage.setItem('nx_users', JSON.stringify(users));

                if (docId && !docId.startsWith('local_') && !docId.startsWith('entity_')) {
                    try {
                        await deleteDoc(doc(db, 'profiles', docId));
                    } catch(e) {}
                }

                openAdminModal();
                renderChatsList();
            }
        };

        window.closeAdminModal = function() {
            document.getElementById('admin-modal').style.display = 'none';
        };
    </script>
</body>
</html>
